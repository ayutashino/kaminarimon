<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ケアノート 訪問介護 管理システム</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0e8a8a">

<!-- ============================================================
     接続設定は firebase-config.js に分離しています。
     このHTMLを更新しても firebase-config.js は差し替え不要です。
     （設定ファイルが無い場合はローカル保存モードで動作します）
     ============================================================ -->
<script src="firebase-config.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<style>
  :root{
    --teal:#0e8a8a; --teal-d:#0a6d6d; --teal-l:#e6f4f4; --teal-l2:#d3ecec;
    --ink:#1f2933; --ink2:#3e4c59; --muted:#7b8794; --muted2:#9aa5b1;
    --bg:#f4f7f8; --card:#fff; --line:#e1e7ea; --line2:#eef2f4;
    --amber:#e8a13a; --amber-l:#fdf3e2; --rose:#d9534f; --rose-l:#fbeceb;
    --green:#3a9d5d; --green-l:#e8f5ed; --blue:#3a7bd5; --blue-l:#eaf1fb;
    --shadow:0 1px 2px rgba(16,42,47,.06),0 8px 24px rgba(16,42,47,.08);
    --radius:14px;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:"Yu Gothic","Hiragino Kaku Gothic ProN","Segoe UI",system-ui,sans-serif;
    color:var(--ink);background:#dbe3e6;font-size:13.5px;line-height:1.55;-webkit-font-smoothing:antialiased;}
  .app{max-width:1240px;margin:0 auto;padding:14px;}
  .win{background:var(--bg);border-radius:16px;overflow:hidden;box-shadow:0 12px 40px rgba(16,42,47,.18);border:1px solid #cfd8dc;}
  .topbar{background:#fff;border-bottom:1px solid var(--line);height:56px;display:flex;align-items:center;padding:0 18px;gap:12px;}
  .logo{display:flex;align-items:center;gap:9px;font-weight:800;color:var(--teal-d);font-size:15px;cursor:pointer;}
  .logo .mark{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--teal),var(--teal-d));
    display:grid;place-items:center;color:#fff;font-size:16px;box-shadow:0 3px 8px rgba(14,138,138,.4);}
  .topsearch{flex:1;max-width:360px;display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);
    border-radius:10px;padding:8px 12px;color:var(--muted);font-size:12.5px;}
  .top-right{margin-left:auto;display:flex;align-items:center;gap:10px;}
  .icoic{width:34px;height:34px;border-radius:10px;background:var(--bg);display:grid;place-items:center;color:var(--ink2);font-size:15px;cursor:pointer;}
  .avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#5aa0a0,#0e8a8a);color:#fff;
    display:grid;place-items:center;font-weight:700;font-size:13px;}
  .shell{display:flex;min-height:620px;}
  .side{width:196px;background:#fff;border-right:1px solid var(--line);padding:14px 12px;flex-shrink:0;}
  .side .grp{font-size:10.5px;font-weight:700;color:var(--muted2);letter-spacing:.06em;padding:12px 10px 6px;text-transform:uppercase;}
  .side a{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;color:var(--ink2);
    text-decoration:none;font-size:13px;font-weight:600;margin-bottom:2px;cursor:pointer;}
  .side a .i{width:18px;text-align:center;opacity:.8;}
  .side a:hover{background:var(--bg);}
  .side a.on{background:var(--teal-l);color:var(--teal-d);}
  .main{flex:1;padding:0 0 22px;overflow:auto;}

  .phead{display:flex;align-items:flex-start;gap:12px;padding:18px 26px 0;}
  .phead h1{font-size:20px;margin:0 0 3px;font-weight:800;}
  .crumb{color:var(--muted);font-size:12px;}
  .crumb a{color:var(--teal-d);cursor:pointer;}
  .phead .sp{flex:1;}
  .btn{border:1px solid var(--line);background:#fff;color:var(--ink2);border-radius:10px;padding:9px 15px;
    font-size:13px;cursor:pointer;font-weight:700;font-family:inherit;display:inline-flex;align-items:center;gap:7px;transition:.15s;}
  .btn:hover{border-color:var(--muted2);}
  .btn.primary{background:var(--teal);color:#fff;border-color:var(--teal);box-shadow:0 3px 10px rgba(14,138,138,.3);}
  .btn.primary:hover{background:var(--teal-d);}
  .btn.ghost{background:transparent;border-color:transparent;color:var(--teal-d);}
  .btn.sm{padding:6px 11px;font-size:12px;}
  .btn.danger{color:var(--rose);border-color:var(--rose-l);}
  .btn.danger:hover{background:var(--rose-l);}

  .card{margin:0 26px;background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;}
  .toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:16px 26px;}
  .search{flex:1;min-width:200px;display:flex;align-items:center;gap:9px;background:#fff;border:1px solid var(--line);
    border-radius:11px;padding:0 14px;box-shadow:var(--shadow);}
  .search input{border:none;outline:none;background:transparent;padding:10px 0;font-size:13px;width:100%;font-family:inherit;color:var(--ink);}
  select.sel,.sel{background:#fff;border:1px solid var(--line);border-radius:11px;padding:10px 12px;font-size:12.5px;color:var(--ink2);
    font-weight:600;box-shadow:var(--shadow);font-family:inherit;cursor:pointer;}

  table{width:100%;border-collapse:collapse;font-size:13px;}
  thead th{text-align:left;padding:12px 26px;color:var(--muted);font-size:11.5px;font-weight:700;letter-spacing:.03em;
    text-transform:uppercase;border-bottom:1px solid var(--line);background:#fafcfc;}
  tbody td{padding:12px 26px;border-bottom:1px solid var(--line2);vertical-align:middle;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr.clickable:hover{background:#fafdfd;cursor:pointer;}
  .uava{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-weight:800;color:#fff;font-size:14px;flex-shrink:0;}
  .cellflex{display:flex;align-items:center;gap:12px;}
  .uname{font-weight:700;color:var(--ink);}
  .ukana{color:var(--muted);font-size:11.5px;}
  .pill{display:inline-flex;align-items:center;gap:5px;padding:4px 11px;border-radius:20px;font-size:11.5px;font-weight:700;}
  .pill.care{background:var(--teal-l);color:var(--teal-d);}
  .pill.active{background:var(--green-l);color:var(--green);}
  .pill.pause{background:var(--amber-l);color:#b9791f;}
  .pill.end{background:#f0f2f4;color:var(--muted);}
  .dot{width:7px;height:7px;border-radius:50%;display:inline-block;}
  .rowact{color:var(--muted2);font-size:16px;text-align:right;}
  .tfoot{display:flex;align-items:center;gap:8px;padding:14px 26px;color:var(--muted);font-size:12.5px;border-top:1px solid var(--line2);}
  .empty{padding:50px 26px;text-align:center;color:var(--muted2);}

  /* detail */
  .prof{display:flex;align-items:center;gap:16px;padding:20px 22px;}
  .prof .big{width:60px;height:60px;border-radius:16px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:22px;}
  .prof h2{margin:0;font-size:19px;font-weight:800;}
  .prof .meta{color:var(--muted);font-size:12.5px;margin-top:2px;}
  .tabs{display:flex;gap:4px;padding:0 22px;border-bottom:1px solid var(--line);}
  .tabs span{padding:13px 4px;margin-right:22px;font-size:13.5px;font-weight:700;color:var(--muted);cursor:pointer;
    border-bottom:2.5px solid transparent;margin-bottom:-1px;}
  .tabs span.on{color:var(--teal-d);border-bottom-color:var(--teal);}
  .sectitle{font-size:12px;font-weight:800;color:var(--teal-d);letter-spacing:.04em;text-transform:uppercase;
    margin:0 0 4px;display:flex;align-items:center;gap:8px;}
  .sectitle::before{content:"";width:4px;height:14px;border-radius:3px;background:var(--teal);display:inline-block;}
  .fgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px 30px;margin:12px 0 6px;}
  .f{display:flex;flex-direction:column;gap:5px;}
  .f.full{grid-column:1 / -1;}
  .f label{font-size:11.5px;color:var(--muted);font-weight:700;}
  .f label .req{color:var(--rose);margin-left:3px;}
  .f .val{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 13px;font-size:13px;color:var(--ink);font-weight:600;min-height:39px;}
  .sblock{padding:8px 22px 20px;}
  .rec{margin:14px 22px 0;background:var(--teal-l);border:1px solid var(--teal-l2);border-radius:12px;padding:13px 16px;
    display:flex;align-items:center;gap:12px;font-size:12.5px;color:var(--teal-d);}
  .subbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:16px 22px 4px;}
  .segment{display:inline-flex;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:3px;}
  .segment span{padding:6px 14px;font-size:12.5px;font-weight:700;color:var(--muted);border-radius:8px;cursor:pointer;}
  .segment span.on{background:#fff;color:var(--teal-d);box-shadow:0 1px 3px rgba(0,0,0,.08);}
  .datecell{font-weight:800;color:var(--ink);}
  .datecell small{display:block;color:var(--muted);font-weight:600;font-size:11px;}
  .svc{display:inline-flex;align-items:center;gap:7px;font-weight:700;}
  .svc .bar{width:4px;height:15px;border-radius:3px;display:inline-block;}
  .who{display:inline-flex;align-items:center;gap:8px;}
  .miniava{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:11px;
    background:linear-gradient(135deg,#5aa0a0,#0e8a8a);}
  .tag{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:16px;font-size:11px;font-weight:700;}
  .tag.plan{background:var(--blue-l);color:var(--blue);} .tag.done{background:var(--green-l);color:var(--green);}
  .tag.cancel{background:#f0f2f4;color:var(--muted);} .tag.draft{background:var(--amber-l);color:#b9791f;}
  .tag.warn{background:var(--rose-l);color:var(--rose);}
  .vitals{display:flex;gap:8px;color:var(--ink2);font-size:11.5px;font-weight:600;flex-wrap:wrap;}
  .vitals span{background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:2px 8px;}
  .monthhdr{padding:12px 22px 6px;font-size:12px;font-weight:800;color:var(--muted);background:#fbfdfd;border-bottom:1px solid var(--line2);}
  .dayhdr td{background:#f7fafa;font-weight:800;color:var(--teal-d);font-size:12px;padding:6px 26px;border-bottom:1px solid var(--line2);}
  tbody tr.rcompact td{padding:8px 26px;}

  /* calendar */
  .legend{display:flex;gap:16px;align-items:center;padding:0 26px 12px;font-size:12px;color:var(--muted);flex-wrap:wrap;}
  .legend .lg{display:inline-flex;align-items:center;gap:7px;font-weight:600;color:var(--ink2);}
  .swatch{width:12px;height:12px;border-radius:4px;}
  .cal{width:calc(100% - 52px);margin:0 26px;border-collapse:separate;border-spacing:0;table-layout:fixed;background:#fff;
    border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);border:1px solid var(--line);}
  .cal th{padding:10px 4px;font-size:12px;font-weight:700;color:var(--ink2);background:#fafcfc;border-bottom:1px solid var(--line);}
  .cal th.today{color:var(--teal-d);}
  .cal th small{display:block;font-size:15px;font-weight:800;}
  /* --- グリッド版カレンダー(テーブル非依存) --- */
  .calg{margin:0 26px;background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow);}
  .calg-inner{display:grid;grid-template-columns:58px repeat(7,minmax(0,1fr));}
  .calg .ch{background:#fafcfc;border-bottom:1px solid var(--line);padding:8px 4px;text-align:center;
    font-size:12px;font-weight:700;color:var(--ink2);line-height:1.25;}
  .calg .ch.today{color:var(--teal-d);}
  .calg .ch b{display:block;font-size:15px;font-weight:800;}
  .calg .ct{background:#fafcfc;border-right:1px solid var(--line);border-bottom:1px solid var(--line2);
    display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--muted);}
  .calg .cc{border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);padding:4px;
    min-height:46px;box-sizing:border-box;}
  .calg .cc.last{border-right:none;} .calg .cc.todaycol{background:#f5fbfb;}
  /* --- リスト版 実施記録 --- */
  .rlist{margin:0 26px;background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow);}
  .rday{background:#f7fafa;font-weight:800;color:var(--teal-d);font-size:12px;padding:7px 22px;border-bottom:1px solid var(--line2);}
  .rrow{display:flex;align-items:center;gap:14px;padding:9px 22px;border-bottom:1px solid var(--line2);min-height:0;}
  .rrow:last-child{border-bottom:none;}
  .rrow .c-time{width:104px;flex-shrink:0;font-weight:700;font-size:12.5px;white-space:nowrap;}
  .rrow .c-user{width:170px;flex-shrink:0;display:flex;align-items:center;gap:9px;font-size:13px;}
  .rrow .c-svc{width:120px;flex-shrink:0;}
  .rrow .c-who{width:110px;flex-shrink:0;display:flex;align-items:center;gap:7px;font-size:12.5px;}
  .rrow .c-st{flex:1;min-width:80px;}
  .rrow .c-act{flex-shrink:0;}
  .rhead{display:flex;gap:14px;padding:10px 22px;background:#fafcfc;border-bottom:1px solid var(--line);
    font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;}
  .rhead div:nth-child(1){width:104px;flex-shrink:0;} .rhead div:nth-child(2){width:170px;flex-shrink:0;}
  .rhead div:nth-child(3){width:120px;flex-shrink:0;} .rhead div:nth-child(4){width:110px;flex-shrink:0;}
  .rhead div:nth-child(5){flex:1;}
  .cal td{border-bottom:1px solid var(--line2);border-right:1px solid var(--line2);height:42px;max-height:120px;padding:3px;vertical-align:top;}
  .cal td:last-child{border-right:none;}
  .cal .tcol{width:56px;text-align:center;font-weight:700;color:var(--muted);font-size:11px;background:#fafcfc;border-right:1px solid var(--line);vertical-align:middle;}
  .cal td.todaycol{background:#f5fbfb;}
  .vc{border-radius:7px;padding:4px 7px;font-size:10.5px;margin-bottom:3px;line-height:1.25;cursor:pointer;border-left:3px solid;}
  .vc b{display:block;font-size:11px;} .vc small{color:var(--muted);}
  .vc.cancel{opacity:.5;text-decoration:line-through;}
  .vc.body{background:var(--blue-l);border-color:var(--blue);} .vc.live{background:var(--teal-l);border-color:var(--teal);}
  .vc.ride{background:var(--green-l);border-color:var(--green);}
  .addc{width:100%;height:34px!important;max-height:34px;border:1.5px dashed transparent;border-radius:7px;color:var(--muted2);background:transparent;
    font-size:14px;cursor:pointer;line-height:1;display:block;padding:0;}
  .cal td:hover .addc{border-color:var(--line);} .addc:hover{border-color:var(--teal)!important;color:var(--teal);background:var(--teal-l);}

  /* modal */
  .overlay{position:fixed;inset:0;background:rgba(20,40,45,.5);display:flex;align-items:flex-start;justify-content:center;
    padding:5vh 16px;z-index:50;overflow:auto;}
  .modal{width:100%;max-width:640px;background:#fff;border-radius:16px;box-shadow:0 24px 60px rgba(0,0,0,.35);overflow:hidden;margin:auto;}
  .modal.wide{max-width:760px;}
  .mhead{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;}
  .mhead h3{margin:0;font-size:16px;font-weight:800;}
  .mhead .x{margin-left:auto;color:var(--muted2);font-size:20px;cursor:pointer;line-height:1;}
  .mbody{padding:20px 22px;max-height:66vh;overflow:auto;}
  .mfoot{padding:16px 22px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;align-items:center;}
  .mfoot .lsp{margin-right:auto;}
  .frm{display:grid;grid-template-columns:1fr 1fr;gap:14px 18px;}
  .fld{display:flex;flex-direction:column;gap:6px;} .fld.full{grid-column:1 / -1;}
  .fld label{font-size:11.5px;color:var(--ink2);font-weight:700;} .fld label .req{color:var(--rose);margin-left:2px;}
  .fld input,.fld select,.fld textarea{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;
    font-size:13px;color:var(--ink);font-family:inherit;font-weight:600;outline:none;width:100%;}
  .fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--teal);background:#fff;}
  .fld input.err{border-color:var(--rose);background:var(--rose-l);}
  .subhdr{font-size:11px;font-weight:800;color:var(--teal-d);letter-spacing:.04em;text-transform:uppercase;grid-column:1/-1;margin-top:6px;}
  .chips{display:flex;gap:8px;flex-wrap:wrap;}
  .chip{padding:8px 15px;border-radius:22px;border:1.5px solid var(--line);font-size:12.5px;font-weight:700;color:var(--ink2);cursor:pointer;background:#fff;}
  .chip.on{background:var(--teal);color:#fff;border-color:var(--teal);}
  .days{display:flex;gap:7px;} .day{width:40px;height:40px;border-radius:11px;border:1.5px solid var(--line);display:grid;place-items:center;
    font-size:12.5px;font-weight:700;color:var(--muted);cursor:pointer;background:#fff;}
  .day.on{background:var(--teal);color:#fff;border-color:var(--teal);}
  .banner{border-radius:11px;padding:12px 14px;font-size:12.5px;display:flex;align-items:center;gap:10px;margin-top:14px;grid-column:1/-1;}
  .banner b{font-size:15px;} .banner.ok{background:var(--teal-l);border:1px solid var(--teal-l2);color:var(--teal-d);}
  .banner.warn{background:var(--amber-l);border:1px solid #f0d9a8;color:#b9791f;}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;
    border-radius:12px;font-size:13px;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.3);z-index:99;opacity:0;transition:.25s;pointer-events:none;}
  .toast.show{opacity:1;bottom:34px;}
  .datanote{font-size:11px;color:var(--muted2);padding:4px 14px 0;}
  .soon{padding:56px 26px;text-align:center;}
  .soon-ico{width:74px;height:74px;border-radius:20px;background:var(--teal-l);display:grid;place-items:center;font-size:34px;margin:0 auto 18px;}
  .soon-badge{display:inline-block;background:var(--amber-l);color:#b9791f;font-weight:800;font-size:11px;letter-spacing:.05em;
    padding:5px 13px;border-radius:20px;margin-bottom:14px;}
  .soon h2{font-size:17px;margin:0 0 10px;color:var(--ink);}
  .soon p{max-width:440px;margin:0 auto;color:var(--muted);font-size:13px;line-height:1.7;}
  .soon-tag{display:inline-block;margin-top:16px;background:var(--bg);border:1px solid var(--line);border-radius:20px;
    padding:6px 14px;font-size:12px;font-weight:700;color:var(--teal-d);}
  .vc.done{opacity:.72;} .vc.done b::before{content:"✓ ";color:var(--green);font-weight:800;}
  .rstat{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:16px;font-size:11px;font-weight:700;}
  .rstat.none{background:#f0f2f4;color:var(--muted);} .rstat.draft{background:var(--amber-l);color:#b9791f;} .rstat.done{background:var(--green-l);color:var(--green);}
  .chk{display:flex;align-items:center;gap:8px;padding:9px 11px;border:1.5px solid var(--line);border-radius:10px;cursor:pointer;background:#fff;font-weight:600;font-size:12.5px;}
  .chk.on{background:var(--teal-l);border-color:var(--teal);color:var(--teal-d);}
  .chk .box{width:16px;height:16px;border-radius:5px;border:1.5px solid var(--muted2);display:grid;place-items:center;font-size:11px;color:#fff;flex-shrink:0;}
  .chk.on .box{background:var(--teal);border-color:var(--teal);}
  .chkgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;grid-column:1/-1;}
  .settbl input{width:110px;text-align:right;} .num{font-variant-numeric:tabular-nums;text-align:right;}
  .bill-sum{display:flex;gap:22px;flex-wrap:wrap;padding:14px 26px;border-top:1px solid var(--line2);}
  .bill-sum .b{font-size:12px;color:var(--muted);} .bill-sum .b b{display:block;font-size:17px;color:var(--ink);font-weight:800;margin-top:2px;}
  .togg{width:38px;height:22px;border-radius:20px;background:var(--line);position:relative;cursor:pointer;transition:.15s;flex-shrink:0;display:inline-block;vertical-align:middle;}

const CLOUD = !!(typeof FIREBASE_CONFIG!=='undefined' && FIREBASE_CONFIG.apiKey && FIREBASE_CONFIG.projectId);
const COLLECTIONS = ['users','visits','records','staff','handovers','reports'];
let fbAuth=null, fbDb=null, lastSnap={}, saveTimer=null;

function normalize(d){
  if(!d) d=seed();
  if(!d.staff||!d.staff.length) d.staff=defaultStaff();
  if(!d.settings) d.settings=defaultSettings();
  if(!d.settings.office) d.settings.office=defaultSettings().office;
  /* 旧形式(単一の単価・単位数)→ 改定世代リストへ自動移行 */
  if(!Array.isArray(d.settings.revisions)||!d.settings.revisions.length){
    d.settings.revisions=[{ id:uid('rev'), from:'2000-01', label:'現行',
      unitPrice:(d.settings.unitPrice!==undefined?d.settings.unitPrice:10.00),
      shoguuPct:(d.settings.shoguuPct||0), tokuteiPct:(d.settings.tokuteiPct||0),
      units:Object.assign({},UNIT_DEFAULT,d.settings.units||{}) }];
  }
  /* 各世代に、アプリ更新で増えた新コードの初期値を補う(既存の値は保持) */
  d.settings.revisions.forEach(r=>{
    if(!r.id) r.id=uid('rev');
    if(!r.from) r.from='2000-01';
    if(!r.label) r.label='料金表';
    if(r.unitPrice===undefined) r.unitPrice=10.00;
    if(r.shoguuPct===undefined) r.shoguuPct=0;
    if(r.tokuteiPct===undefined) r.tokuteiPct=0;
    r.units=Object.assign({},UNIT_DEFAULT,r.units||{});
  });
  delete d.settings.units; delete d.settings.unitPrice; delete d.settings.shoguuPct; delete d.settings.tokuteiPct;
  if(!d.billFlags) d.billFlags={};
  if(!d.handovers) d.handovers=[];
  if(!d.reports) d.reports=[];
  COLLECTIONS.forEach(c=>{ if(!Array.isArray(d[c])) d[c]=[]; });
  (d.staff||[]).forEach(s=>{ if(s.wage===undefined)s.wage=defaultWage(s.role); if(s.allowance===undefined)s.allowance=defaultAllow(s.role); });
  (d.records||[]).forEach(x=>{ if(!x.code) x.code=defaultCode(x.svcType); if(!x.helper&&x.visitId){ const v=(d.visits||[]).find(vv=>vv.id===x.visitId); if(v)x.helper=v.helper; } });
  return d;
}

  d=normalize(d);

  return d; }

/* ---- 保存: クラウドなら差分のみFirestoreへ、ローカルならlocalStorage ---- */
function save(){
  if(CLOUD){ scheduleCloudSave(); return; }
  try{ localStorage.setItem(LS_KEY, JSON.stringify(DB)); }catch(e){ STORAGE_OK=false; showStorageWarning(); }
}
function officeRef(){ return fbDb.collection('offices').doc(OFFICE_ID); }
function takeSnap(){ const s={}; COLLECTIONS.forEach(c=>{ s[c]={}; (DB[c]||[]).forEach(x=>s[c][x.id]=JSON.stringify(x)); });
  s.__meta=JSON.stringify({settings:DB.settings,billFlags:DB.billFlags}); lastSnap=s; }
function scheduleCloudSave(){ setSyncState('saving'); clearTimeout(saveTimer); saveTimer=setTimeout(cloudSave,700); }
async function cloudSave(){
  try{
    let ops=[]; // {type,ref,data}
    COLLECTIONS.forEach(c=>{
      const cur={}; (DB[c]||[]).forEach(x=>cur[x.id]=JSON.stringify(x));
      const prev=lastSnap[c]||{};
      Object.keys(cur).forEach(id=>{ if(cur[id]!==prev[id]) ops.push({t:'set',r:officeRef().collection(c).doc(id),d:JSON.parse(cur[id])}); });
      Object.keys(prev).forEach(id=>{ if(!(id in cur)) ops.push({t:'del',r:officeRef().collection(c).doc(id)}); });
    });
    const metaNow=JSON.stringify({settings:DB.settings,billFlags:DB.billFlags});
    if(metaNow!==lastSnap.__meta) ops.push({t:'set',r:officeRef(),d:JSON.parse(metaNow)});
    // 500件ずつバッチ実行
    for(let i=0;i<ops.length;i+=450){
      const batch=fbDb.batch();
      ops.slice(i,i+450).forEach(o=>{ o.t==='set'? batch.set(o.r,o.d) : batch.delete(o.r); });
      await batch.commit();
    }
    takeSnap(); setSyncState('saved');
  }catch(e){ console.error(e); setSyncState('error'); toast('保存に失敗しました: '+(e.message||e)); }
}
async function cloudLoad(){
  const d={};
  for(const c of COLLECTIONS){
    const snap=await officeRef().collection(c).get();
    d[c]=snap.docs.map(doc=>Object.assign({id:doc.id},doc.data()));
  }
  const meta=await officeRef().get();
  const m=meta.exists? meta.data() : {};
  d.settings=m.settings; d.billFlags=m.billFlags;
  const empty=COLLECTIONS.every(c=>!d[c].length);
  DB = empty ? normalize(null) : normalize(d);   // 初回は初期データを投入
  if(empty){ takeSnapEmpty(); await cloudSave(); } else { takeSnap(); }
}
function takeSnapEmpty(){ lastSnap={}; COLLECTIONS.forEach(c=>lastSnap[c]={}); lastSnap.__meta=''; }
function setSyncState(s){
  const el=document.getElementById('modeChip'); if(!el||!CLOUD) return;
  const map={saving:['保存中…','cloud'],saved:['クラウド保存','cloud'],error:['保存エラー','local']};
  const v=map[s]||map.saved; el.textContent=v[0]; el.className='modechip '+v[1];
}

function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function age(birth){ if(!birth) return ''; const b=new Date(birth), n=new Date('2026-07-26'); let a=n.getFullYear()-b.getFullYear(); if(n.getMonth()<b.getMonth()||(n.getMonth()===b.getMonth()&&n.getDate()<b.getDate()))a--; return a; }
function initial(name){ return (name||'？').trim().charAt(0); }
function pad(n){ return String(n).padStart(2,'0'); }
function fmt(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function mondayOf(d){ const x=new Date(d); const day=(x.getDay()+6)%7; x.setDate(x.getDate()-day); x.setHours(0,0,0,0); return fmt(x); }
function addDays(iso,n){ const d=new Date(iso); d.setDate(d.getDate()+n); return fmt(d); }
const WD=['日','月','火','水','木','金','土'];
function wd(iso){ return WD[new Date(iso).getDay()]; }
function mdw(iso){ const d=new Date(iso); return (d.getMonth()+1)+'/'+d.getDate()+' ('+WD[d.getDay()]+')'; }
function statusPill(s){ const m={'利用中':'active','休止':'pause','終了':'end'}; const dotc={'利用中':'var(--green)','休止':'var(--amber)','終了':'var(--muted)'}; return '<span class="pill '+(m[s]||'end')+'"><span class="dot" style="background:'+dotc[s]+'"></span>'+esc(s)+'</span>'; }

function paneHist(u){
  const months=[...new Set(DB.records.filter(r=>r.userId===u.id).map(r=>r.date.slice(0,7)))].sort().reverse();
  if(!months.length) return '<div class="empty">記録がまだありません(実施記録はスマホアプリ側=F2 で作成される想定です)</div>';
  if(!months.includes(ui.histMonth)) ui.histMonth=months[0];
  let rs=DB.records.filter(r=>r.userId===u.id&&r.date.slice(0,7)===ui.histMonth).sort((a,b)=>b.date.localeCompare(a.date));
  const seg=months.map(m=>'<span class="'+(ui.histMonth===m?'on':'')+'" onclick="ui.histMonth=\''+m+'\';render()">'+m.replace('-','年')+'月</span>').join('');
  const done=rs.filter(r=>r.status!=='missed').length, missed=rs.filter(r=>r.status==='missed').length;
  const rows=rs.map(r=>{
    const s=SVC[r.svcType];
    let tag='';
    if(r.status==='confirmed') tag='<span class="tag done">確定</span>';
    else if(r.status==='draft') tag='<span class="tag draft">下書き</span>'+(r.sync==='pending'?' <span style="font-size:11px;color:var(--muted)">🟠未同期</span>':'');
    else if(r.status==='missed') tag='<span class="tag warn">未実施(要確認)</span>';
    const vit=(r.temp||r.bp||r.spo2)? '<div class="vitals">'+(r.temp?'<span>'+esc(r.temp)+'℃</span>':'')+(r.bp?'<span>'+esc(r.bp)+'</span>':'')+(r.spo2?'<span>SpO₂ '+esc(r.spo2)+'</span>':'')+'</div>' : '<span style="color:var(--muted2)">—</span>';
    const time=r.status==='missed'?'<small>— 未実施 —</small>':'<small>'+r.as+'–'+r.ae+'</small>';
    const dur=r.status==='missed'?'—':durMin(r.as,r.ae)+'分';
    return '<tr><td class="datecell">'+mdw(r.date)+time+'</td>'+
      '<td><span class="svc '+s.cls+'"><span class="bar" style="background:'+s.color+'"></span>'+esc(s.label)+'</span></td>'+
      '<td>'+vit+'</td><td>'+dur+'</td><td>'+tag+'</td></tr>';
  }).join('');
  return ''+
    '<div class="subbar"><div class="segment">'+seg+'</div><div class="sp" style="flex:1"></div>'+
      '<button class="btn sm" onclick="toast(\'※実績記録票の出力はF4で実装予定\')">⬇ 記録票を出力</button></div>'+
    '<div style="height:6px"></div><div class="monthhdr">'+ui.histMonth.replace('-','年')+'月 ・ 実施 '+done+'件 / 未実施 '+missed+'件</div>'+
    '<table><thead><tr><th>提供日</th><th>サービス</th><th>バイタル</th><th>実績時間</th><th>状態</th></tr></thead><tbody>'+rows+'</tbody></table>'+
    '<div class="tfoot">'+rs.length+' 件</div>';
}
function codeShort(v){ return v.code? v.code.split('(')[0] : SVC[v.svcType].label; }
function durMin(a,b){ if(!a||!b)return 0; const[h1,m1]=a.split(':').map(Number),[h2,m2]=b.split(':').map(Number); return (h2*60+m2)-(h1*60+m1); }

/* ============================ カレンダー ============================ */
function viewCal(){
  const days=[...Array(7)].map((_,i)=>addDays(ui.week,i));
  // 予定のある時間帯のみ表示(なければ標準の午前〜午後)
  const wkVisits=DB.visits.filter(v=>days.includes(v.date)&&v.status!=='cancel');
  let hourNums=[...new Set(wkVisits.map(v=>parseInt(v.start.slice(0,2))))].sort((a,b)=>a-b);
  if(!hourNums.length) hourNums=[9,10,11,13,14];
  const hours=hourNums.map(n=>pad(n)+':00');
  const today='2026-07-26';
  let grid='<div class="ch"></div>'+days.map(d=>'<div class="ch'+(d===today?' today':'')+'">'+wd(d)+'<b>'+new Date(d).getDate()+'</b></div>').join('');
  hours.forEach(h=>{
    grid+='<div class="ct">'+h+'</div>';
    days.forEach((d,di)=>{
      const vs=DB.visits.filter(v=>v.date===d && v.start.slice(0,2)===h.slice(0,2)).sort((a,b)=>a.start.localeCompare(b.start));
      const cards=vs.map(v=>{ const s=SVC[v.svcType]; const u=DB.users.find(x=>x.id===v.userId);
        return '<div class="vc '+s.cls+(v.status==='cancel'?' cancel':'')+(v.status==='done'?' done':'')+'" onclick="openVisitForm({id:\''+v.id+'\'})"><b>'+esc(u?u.name:'?')+'</b><small>'+esc(codeShort(v))+' · '+esc(v.helper)+'</small></div>';
      }).join('');
      const addBtn='<button class="addc" onclick="openVisitForm({date:\''+d+'\',start:\''+h+'\'})">＋</button>';
      grid+='<div class="cc'+(di===6?' last':'')+(d===today?' todaycol':'')+'">'+(vs.length?cards:addBtn)+'</div>';
    });
  });
  const wkLabel=(()=>{ const a=new Date(ui.week),b=new Date(addDays(ui.week,6)); return a.getFullYear()+'年 '+(a.getMonth()+1)+'/'+a.getDate()+' – '+(b.getMonth()+1)+'/'+b.getDate(); })();
  return ''+
  '<div class="phead"><div><h1>訪問予定</h1><div class="crumb">ホーム / 訪問予定</div></div><div class="sp"></div>'+
    '<button class="btn" onclick="openBulkForm()">⚡ 一括作成</button>'+
    '<button class="btn primary" onclick="openVisitForm({date:\''+ui.week+'\',start:\'10:00\'})">＋ 予定追加</button></div>'+
  '<div class="toolbar" style="padding-bottom:8px"><div style="display:flex;align-items:center;gap:10px">'+
    '<button class="btn" onclick="shiftWeek(-1)">‹</button><div class="sel" style="box-shadow:none">'+wkLabel+'</div>'+
    '<button class="btn" onclick="shiftWeek(1)">›</button><button class="btn ghost" onclick="ui.week=mondayOf(new Date(\'2026-07-27\'));render()">サンプル週</button></div></div>'+
  '<div class="legend"><span class="lg"><span class="swatch" style="background:'+SVC.body.color+'"></span>身体介護</span>'+
    '<span class="lg"><span class="swatch" style="background:'+SVC.live.color+'"></span>生活援助</span>'+
    '<span class="lg"><span class="swatch" style="background:'+SVC.ride.color+'"></span>通院等乗降</span></div>'+
  '<div class="calg"><div class="calg-inner">'+grid+'</div></div>'+
  '<div style="padding:10px 26px 22px;font-size:11.5px;color:var(--muted2)">※ 予定のある時間帯のみ表示しています。別の時間に追加するときは右上の「＋予定追加」から時刻を指定してください。</div>';
}

  root.querySelector('#svcTypeH').value=k; root.querySelector('#codeSel').innerHTML=codeOpts(k,''); }
function bulkComputeDates(){
  const root=document.querySelector('.overlay');
  const from=root.querySelector('[data-k=from]').value, to=root.querySelector('[data-k=to]').value;
  const days=[...root.querySelectorAll('#dayPick .day.on')].map(x=>+x.dataset.d);
  const out=[]; if(!from||!to||to<from||!days.length) return out;
  let d=from; let guard=0;
  while(d<=to && guard<400){ if(days.includes(new Date(d).getDay())) out.push(d); d=addDays(d,1); guard++; }
  return out;
}
function bulkPreview(){
  const root=document.querySelector('.overlay'); if(!root)return;
  const dates=bulkComputeDates();
  const userId=root.querySelector('[data-k=userId]').value, helper=root.querySelector('[data-k=helper]').value;
  const start=root.querySelector('[data-k=start]').value;
  let conflict=0; dates.forEach(dt=>{ if(DB.visits.some(v=>v.date===dt&&v.helper===helper&&v.start===start&&v.status!=='cancel'))conflict++; });
  const b=root.querySelector('#bulkBanner');
  if(!dates.length){ b.innerHTML='<div class="banner warn">⚠ 曜日・期間を指定してください。</div>'; }
  else { b.innerHTML='<div class="banner ok">✅ この条件で <b>'+dates.length+' 件</b> の予定が作成されます。'+(conflict?'<span style="color:#b9791f">※うち '+conflict+' 件は同一担当・同時刻の既存予定と重複します。</span>':'')+'</div>'; }
  const btn=root.querySelector('#bulkCreateBtn'); btn.textContent=dates.length?dates.length+'件を作成':'作成'; btn.disabled=!dates.length;
}
function bulkCreate(){
  const root=document.querySelector('.overlay'); const dates=bulkComputeDates(); if(!dates.length){toast('曜日・期間を指定してください');return;}
  const g=k=>root.querySelector('[data-k='+k+']').value;
  const userId=g('userId'),helper=g('helper'),svcType=g('svcType'),code=g('code'),start=g('start'),end=g('end');
  if(end<=start){ toast('終了時刻は開始より後にしてください'); return; }
  dates.forEach(dt=>DB.visits.push({id:uid('v'),userId,date:dt,start,end,svcType,code,helper,status:'plan'}));
  save(); closeModal();
  ui.week=mondayOf(new Date(dates[0])); ui.screen='cal'; render();

}

function billMonths(){ const ms=[...new Set(DB.records.map(r=>r.date.slice(0,7)))]; if(!ms.includes(ui.billMonth))ms.push(ui.billMonth); return ms.sort().reverse(); }
function billFor(userId,month){
  const st=revisionFor(month);   // ← 対象月に適用される料金表を使用(過去月は当時の単価のまま)
  const recs=DB.records.filter(r=>r.userId===userId&&r.status==='confirmed'&&r.date.slice(0,7)===month);
  const g={}; recs.forEach(r=>{ g[r.code]=(g[r.code]||0)+1; });
  const items=Object.keys(g).map(code=>({code,count:g[code],unit:st.units[code]||0,units:g[code]*(st.units[code]||0)}));
  const base=items.reduce((s,i)=>s+i.units,0);
  // 初回加算:当該利用者に当月より前の確定記録が無ければ「初回」と自動判定(200単位)
  const anyBefore=DB.records.some(r=>r.userId===userId&&r.status==='confirmed'&&r.date.slice(0,7)<month);
  const initialAuto = recs.length>0 && !anyBefore;
  const flag=DB.billFlags[month+'|'+userId]||{};
  const initialOn = flag.initial!==undefined ? !!flag.initial : initialAuto;
  const initial = initialOn?200:0;
  // 緊急時訪問介護加算:緊急フラグ付き訪問の確定記録 ×100単位/回
  let emgCount=0; recs.forEach(r=>{ const v=DB.visits.find(x=>x.id===r.visitId); if(v&&v.emergency)emgCount++; });
  const emergency = emgCount*100;
  // 特定事業所加算:設定率を基本単位に適用(事業所要件は設定で管理)
  const tokutei = Math.round(base*(st.tokuteiPct||0)/100);
  const subtotal = base+initial+emergency+tokutei;
  // 処遇改善加算:小計に率を適用
  const shoguu = Math.round(subtotal*(st.shoguuPct||0)/100);
  const total = subtotal+shoguu;
  const cost=Math.round(total*st.unitPrice);
  const u=DB.users.find(x=>x.id===userId); const rate=futanRate(u?u.futan:'1割');
  const futan=Math.round(cost*rate); const kyufu=cost-futan;
  return {items,base,initial,initialAuto,initialOn,emgCount,emergency,tokutei,shoguu,total,cost,futan,kyufu,rate,count:recs.length};
}

/* ============================ 6. レポート ============================ */
function viewDash(){
  if(!ui.dashMonth) ui.dashMonth='2026-07';
  const month=ui.dashMonth;
  const monthsSet=[...new Set(DB.visits.map(v=>v.date.slice(0,7)).concat(DB.records.map(r=>r.date.slice(0,7))))];
  if(!monthsSet.includes(month)) monthsSet.push(month);
  const monthOpts=monthsSet.sort().reverse().map(m=>'<option '+(m===month?'selected':'')+'>'+m+'</option>').join('');
  const vs=DB.visits.filter(v=>v.date.slice(0,7)===month);
  const active=vs.filter(v=>v.status!=='cancel');
  const done=vs.filter(v=>v.status==='done').length;
  const cancel=vs.filter(v=>v.status==='cancel').length;
  const recs=DB.records.filter(r=>r.date.slice(0,7)===month);
  const confirmed=recs.filter(r=>r.status==='confirmed').length;
  const missed=recs.filter(r=>r.status==='missed').length;
  const util=active.length? Math.round(done/active.length*100):0;
  const billedUsers=DB.users.filter(u=>DB.records.some(r=>r.userId===u.id&&r.status==='confirmed'&&r.date.slice(0,7)===month));
  let tUnits=0,tCost=0; billedUsers.forEach(u=>{ const b=billFor(u.id,month); tUnits+=b.total; tCost+=b.cost; });
  const reps=DB.reports.filter(r=>r.date.slice(0,7)===month);
  const near=reps.filter(r=>r.type==='ヒヤリハット').length, acc=reps.filter(r=>r.type==='事故').length;
  // 利用者別訪問数(実施+予定, 非キャンセル)
  const perUser=DB.users.map(u=>({name:u.name,n:active.filter(v=>v.userId===u.id).length})).filter(x=>x.n>0).sort((a,b)=>b.n-a.n);
  const maxU=Math.max(1,...perUser.map(x=>x.n));
  // 職員別稼働時間
  const perHelper=helperNames().map(h=>({name:h,mins:active.filter(v=>v.helper===h).reduce((s,v)=>s+durMin(v.start,v.end),0)})).filter(x=>x.mins>0).sort((a,b)=>b.mins-a.mins);
  const maxH=Math.max(1,...perHelper.map(x=>x.mins));
  // サービス種別内訳
  const mix=Object.keys(SVC).map(k=>({name:SVC[k].label,n:active.filter(v=>v.svcType===k).length,color:SVC[k].color})).filter(x=>x.n>0);
  const maxMix=Math.max(1,...mix.map(x=>x.n));
  // 月次推移(直近6か月の実施件数)
  const trend=[]; for(let i=5;i>=0;i--){ const dd=new Date(month+'-01'); dd.setMonth(dd.getMonth()-i); const mm=dd.getFullYear()+'-'+pad(dd.getMonth()+1); trend.push({name:(dd.getMonth()+1)+'月', n:DB.visits.filter(v=>v.date.slice(0,7)===mm&&v.status==='done').length}); }
  const maxT=Math.max(1,...trend.map(x=>x.n));
  // 加算取得状況
  const initCount=billedUsers.filter(u=>billFor(u.id,month).initial>0).length;
  let emgTotal=0; billedUsers.forEach(u=>emgTotal+=billFor(u.id,month).emgCount);
  const stat=(k,v,s)=>'<div class="stat"><div class="k">'+k+'</div><div class="v">'+v+'</div><div class="s">'+(s||'')+'</div></div>';
  const bars=(list,fmtv,max,color)=>list.length? list.map(x=>{ const val=x.n!==undefined?x.n:x.mins; const w=Math.round(val/max*100);
    return '<div class="barrow"><div class="lab">'+esc(x.name)+'</div><div class="bartrack"><div class="barfill" style="width:'+w+'%;background:'+color+'"></div></div><div class="barval">'+fmtv(x)+'</div></div>'; }).join('') : '<div style="color:var(--muted2);font-size:12px;padding:6px 0">データがありません</div>';
  return '<div class="phead"><div><h1>レポート</h1><div class="crumb">ホーム / レポート</div></div><div class="sp"></div>'+
      '<select class="sel" onchange="ui.dashMonth=this.value;render()">'+monthOpts+'</select></div>'+
    '<div style="height:8px"></div>'+
    '<div class="stat-grid">'+
      stat('訪問(実施予定)',active.length+' 件','キャンセル '+cancel+' 件')+
      stat('稼働率',util+' %','実施 '+done+' / 対象 '+active.length)+
      stat('記録',confirmed+' 確定','下書き含む全'+recs.length+'件 / 未実施 '+missed)+
      stat('請求(確定分)','¥'+tCost.toLocaleString(),tUnits.toLocaleString()+' 単位 / '+billedUsers.length+'名')+
    '</div>'+
    '<div class="stat-grid" style="grid-template-columns:repeat(3,1fr)">'+
      stat('ヒヤリハット',near+' 件',month+' 発生')+
      stat('事故',acc+' 件',month+' 発生')+
      stat('稼働職員',perHelper.length+' 名','この月に訪問あり')+
    '</div>'+
    '<div class="subcard"><h3>利用者別 訪問件数</h3><div class="bars">'+bars(perUser,x=>x.n+'件',maxU,'linear-gradient(90deg,#5aa0d5,#3a7bd5)')+'</div></div>'+
    '<div class="subcard"><h3>職員別 稼働時間</h3><div class="bars">'+bars(perHelper,x=>(x.mins/60).toFixed(1)+'h',maxH,'linear-gradient(90deg,var(--teal),var(--teal-d))')+'</div></div>'+
    '<div class="subcard"><h3>サービス種別 内訳</h3><div class="bars">'+(mix.length?mix.map(x=>{ const w=Math.round(x.n/maxMix*100);
      return '<div class="barrow"><div class="lab">'+esc(x.name)+'</div><div class="bartrack"><div class="barfill" style="width:'+w+'%;background:'+x.color+'"></div></div><div class="barval">'+x.n+'件</div></div>'; }).join(''):'<div style="color:var(--muted2);font-size:12px">データがありません</div>')+'</div></div>'+
    '<div class="subcard"><h3>実施件数の月次推移(直近6か月)</h3><div class="bars" style="display:flex;align-items:flex-end;gap:12px;height:150px;padding:18px 22px">'+
      trend.map(x=>{ const h=Math.round(x.n/maxT*100); return '<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%"><div style="font-size:11px;font-weight:700;color:var(--ink2);margin-bottom:4px">'+x.n+'</div><div style="width:70%;height:'+Math.max(h,3)+'%;background:linear-gradient(180deg,var(--teal),var(--teal-d));border-radius:6px 6px 0 0"></div><div style="font-size:10.5px;color:var(--muted);margin-top:6px">'+x.name+'</div></div>'; }).join('')+'</div></div>'+
    '<div class="subcard"><h3>加算取得状況(当月)</h3><div class="bars"><div class="barrow"><div class="lab">初回加算</div><div style="color:var(--ink2);font-weight:700">'+initCount+' 名</div></div>'+
      '<div class="barrow"><div class="lab">緊急時訪問介護加算</div><div style="color:var(--ink2);font-weight:700">'+emgTotal+' 回</div></div>'+
      '<div class="barrow"><div class="lab">特定事業所加算</div><div style="color:var(--ink2);font-weight:700">'+revisionFor(month).tokuteiPct+' %</div></div>'+
      '<div class="barrow"><div class="lab">処遇改善加算</div><div style="color:var(--ink2);font-weight:700">'+revisionFor(month).shoguuPct+' %</div></div>'+
      '<div class="barrow"><div class="lab">適用料金表</div><div style="color:var(--ink2);font-weight:700">'+esc(revisionFor(month).label)+'（'+esc(revisionFor(month).from)+'〜）</div></div></div></div>'+
    '<div style="padding:0 26px 20px;font-size:11.5px;color:var(--muted2)">※ すべて当月データからの自動集計です。稼働率=実施済 ÷ 対象予定(キャンセル除く)。</div>';
}

/* ============================ 給与計算 ============================ */
function payFor(staff,month){
  const recs=DB.records.filter(r=>r.status==='confirmed'&&r.helper===staff.name&&r.date.slice(0,7)===month);
  const mins=recs.reduce((s,r)=>s+durMin(r.as,r.ae),0);
  const hours=mins/60;
  const basePay=Math.round(hours*(staff.wage||0));
  const gross=basePay+(staff.allowance||0);
  return {visits:recs.length,mins,hours,basePay,allowance:staff.allowance||0,gross};
}
function viewPayroll(){
  if(!ui.payMonth) ui.payMonth='2026-07';
  const month=ui.payMonth;
  const monthsSet=[...new Set(DB.records.map(r=>r.date.slice(0,7)))]; if(!monthsSet.includes(month))monthsSet.push(month);
  const monthOpts=monthsSet.sort().reverse().map(m=>'<option '+(m===month?'selected':'')+'>'+m+'</option>').join('');
  const staff=DB.staff.filter(s=>s.status==='在職'&&(s.wage||0)>0);
  let tHours=0,tGross=0;
  const rows=staff.map(s=>{ const p=payFor(s,month); tHours+=p.hours; tGross+=p.gross;
    return '<tr><td><div class="cellflex"><div class="miniava" style="width:32px;height:32px;border-radius:9px;font-size:13px">'+esc(initial(s.name))+'</div><div><div class="uname">'+esc(s.name)+'</div><div class="ukana">'+esc(s.role)+'</div></div></div></td>'+
      '<td class="num">'+p.visits+' 件</td>'+
      '<td class="num">'+p.hours.toFixed(1)+' h</td>'+
      '<td class="num">¥'+(s.wage||0).toLocaleString()+'</td>'+
      '<td class="num">¥'+p.basePay.toLocaleString()+'</td>'+
      '<td class="num">¥'+p.allowance.toLocaleString()+'</td>'+
      '<td class="num"><b>¥'+p.gross.toLocaleString()+'</b></td></tr>';
  }).join('');
  return '<div class="phead"><div><h1>給与計算</h1><div class="crumb">ホーム / 給与計算</div></div><div class="sp"></div>'+
      '<button class="btn primary" onclick="exportPayrollCSV()">⬇ 給与CSVを出力</button></div>'+
    '<div class="toolbar" style="padding-bottom:8px"><div class="sel" style="box-shadow:none">対象月</div>'+
      '<select class="sel" onchange="ui.payMonth=this.value;render()">'+monthOpts+'</select>'+
      '<div class="sp" style="flex:1"></div><button class="btn" onclick="nav(\'staff\')">👥 職員(時給設定)</button></div>'+
    '<div class="card"><table><thead><tr><th>職員</th><th class="num">訪問</th><th class="num">実働時間</th><th class="num">時給</th><th class="num">基本給</th><th class="num">手当</th><th class="num">総支給</th></tr></thead>'+
      '<tbody>'+(rows||'<tr><td colspan="7"><div class="empty">対象職員がいません</div></td></tr>')+'</tbody></table>'+
      '<div class="bill-sum"><div class="b">合計実働<b>'+tHours.toFixed(1)+' h</b></div><div class="b">総支給 合計<b>¥'+tGross.toLocaleString()+'</b></div></div></div>'+
    '<div style="padding:10px 26px 0;font-size:11.5px;color:var(--muted2)">※ 実働時間は「確定した実施記録」の打刻(実開始〜実終了)から自動集計。基本給=実働時間×時給、総支給=基本給+月額手当。時給・手当は職員画面で設定します。</div>';
}
function exportPayrollCSV(){
  const month=ui.payMonth; const staff=DB.staff.filter(s=>s.status==='在職'&&(s.wage||0)>0);
  if(!staff.length){ toast('対象職員がいません'); return; }
  const head=['対象月','氏名','役割','訪問件数','実働時間(h)','時給','基本給','手当','総支給'];
  const lines=[head.join(',')];
  staff.forEach(s=>{ const p=payFor(s,month); lines.push([month,s.name,s.role,p.visits,p.hours.toFixed(2),s.wage,p.basePay,p.allowance,p.gross].join(',')); });
  const blob=new Blob(['﻿'+lines.join('\r\n')],{type:'text/csv;charset=utf-8;'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='給与_'+month+'.csv'; a.click(); toast('給与CSVを出力しました');
}

  return '<div class="phead"><div><h1>家族ビュー</h1><div class="crumb">ホーム / 家族ビュー(閲覧専用プレビュー)</div></div><div class="sp"></div>'+

      '<div class="fp-card"><div class="fp-head"><h2>'+esc(u.name)+' 様</h2><div class="s">'+esc(u.care)+' ・ 担当 '+esc(u.sahai)+' ・ '+esc(DB.settings.office.name)+'</div></div>'+
        '<div class="fp-sec">最近の訪問報告</div>'+reports+'</div>'+

        '<div style="padding:8px 20px 18px;font-size:13px;color:var(--ink2)">ご不明な点は担当サービス提供責任者(<b>'+esc(u.sahai)+'</b>)までお問い合わせください。<div style="margin-top:8px"><button class="btn primary" onclick="toast(\'※デモ:実際にはメッセージ送信や電話発信につながります\')">事業所に連絡する</button></div></div></div>'+
    '</div>'+
    '<div style="text-align:center;font-size:11.5px;color:var(--muted2);padding-bottom:20px">※ これは家族向け閲覧画面のプレビューです。実運用では家族専用のログインで、担当利用者の情報のみが表示されます。</div>';
}

  const cloudCard= CLOUD

    : '<div class="banner warn" style="margin:0 26px 18px">💾 現在は<b>ローカル保存モード</b>です（このブラウザ内にのみ保存）。クラウド保存にするには、HTMLファイル冒頭の <b>FIREBASE_CONFIG</b> にFirebaseの設定を貼り付けてください。同梱の「Firebaseセットアップ手順」をご覧ください。</div>';
  return '<div class="phead"><div><h1>外部連携</h1><div class="crumb">ホーム / 外部連携</div></div></div>'+
    cloudCard+
    '<div class="integ-grid">'+cards+'</div>'+
    '<div class="subcard" style="margin-top:0"><h3>データのバックアップ / 復元</h3>'+
      '<div style="padding:16px 20px;font-size:13px;color:var(--ink2)">全データ(利用者・予定・記録・実績・職員・設定など)をJSONファイルで書き出し・読み込みできます。'+
      '<div style="margin-top:14px;display:flex;gap:10px;flex-wrap:wrap">'+
        '<button class="btn primary" onclick="exportBackup()">⬇ バックアップを書き出し</button>'+

}
function exportBackup(){ const blob=new Blob([JSON.stringify(DB,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='carenote_backup_2026-07-26.json'; a.click(); toast('バックアップを書き出しました'); }
function importBackup(input){ const file=input.files[0]; if(!file)return; const rd=new FileReader();
  rd.onload=e=>{ try{ const d=JSON.parse(e.target.result); if(!d.users)throw 0;
    if(!confirm('現在のデータを、このバックアップの内容で置き換えます。よろしいですか?')) return;
    DB=normalize(d); save(); ui=freshUi(); render(); toast('バックアップから復元しました'); }
    catch(err){ toast('ファイルの読み込みに失敗しました'); } };
  rd.readAsText(file); }

/* ============================ 使い方ガイド ============================ */

    ['利用者を登録する','「利用者」→「＋新規登録」。氏名・要介護度・保険情報などを入力します。既存の利用者は行をクリックで詳細・ケアプランを確認できます。'],
    ['訪問予定を組む','「訪問予定」で空きマスの＋、または右上「＋予定追加」。曜日パターンでまとめて作るときは「⚡一括作成」。予定のある時間帯だけ表示されます。'],

    ['申し送り・報告','日々の共有は「申し送り」、ヒヤリハットや事故は「報告」に記録します。記録の特記事項は自動で申し送りにも表示されます。'],

    ['シフト・給与・レポート','「シフト」で職員の稼働、「給与計算」で実働×時給を集計、「レポート」で稼働率や件数を確認できます。'],
    ['日誌の出力','「実施記録」→「📘日誌を出力」で、日次・月次・年次を選んで業務日誌を印刷・CSV出力できます。'],
    ['バックアップ','「外部連携」からデータをJSONで書き出し・復元できます。右上の ↺ で初期データに戻せます。'],
    ['保存モードの確認','画面上部のバッジが「クラウド保存」ならFirestoreに自動保存、「ローカル保存」ならこのブラウザ内のみに保存されます。スマホからも同じURLでログインできます。'],
    ['報酬改定への対応','「設定」→料金表で「＋改定を追加」を押し、適用開始年月（例:2027-04）と新しい単位数・率を入力します。請求は対象月の料金表で計算されるため、過去月の金額は変わりません。'],
  ];

/* ============================ 日誌の出力 ============================ */
function openDiary(){
  if(!ui.diaryType) ui.diaryType='月次';
  const t=ui.diaryType;
  const inputs={
    '日次':'<input class="inp" data-k="val" type="date" value="2026-07-27">',
    '月次':'<input class="inp" data-k="val" type="month" value="2026-07">',
    '年次':'<input class="inp" data-k="val" type="number" value="2026" min="2000" max="2100">'
  };
  const scopeOpts='<option value="">全利用者</option>'+DB.users.map(u=>'<option value="'+u.id+'">'+esc(u.name)+'</option>').join('');
  showModal('<div class="modal"><div class="mhead"><h3>📘 日誌を出力</h3><span class="x" onclick="closeModal()">✕</span></div>'+
    '<div class="mbody"><div class="frm">'+
      '<div class="fld full"><label>期間の種類</label><div class="chips" id="dtChips">'+
        ['日次','月次','年次'].map(k=>'<span class="chip '+(t===k?'on':'')+'" onclick="ui.diaryType=\''+k+'\';openDiary()">'+k+'</span>').join('')+'</div></div>'+
      '<div class="fld"><label>対象</label>'+inputs[t]+'</div>'+
      '<div class="fld"><label>利用者</label><select data-k="scope">'+scopeOpts+'</select></div>'+
    '</div></div>'+
    '<div class="mfoot"><button class="btn" onclick="closeModal()">キャンセル</button>'+
      '<button class="btn" onclick="exportDiaryCSV()">CSV出力</button>'+
      '<button class="btn primary" onclick="showDiary()">日誌を表示</button></div></div>');
}
function diaryRecords(){
  const root=document.querySelector('.overlay');
  const type=ui.diaryType||'月次'; const val=root.querySelector('[data-k=val]').value; const scope=root.querySelector('[data-k=scope]').value;
  let rs=DB.records.filter(r=>r.status!=='missed'? true : true); // include all実施記録
  rs=rs.filter(r=>{ if(type==='日次')return r.date===val; if(type==='月次')return r.date.slice(0,7)===val; return r.date.slice(0,4)===String(val); });
  if(scope) rs=rs.filter(r=>r.userId===scope);
  rs.sort((a,b)=>(a.date+a.as).localeCompare(b.date+b.as));
  return {rs,type,val,scope};
}
function diaryLabel(type,val){ return type==='日次'?val:type==='月次'?val.replace('-','年')+'月':val+'年'; }
function showDiary(){
  const {rs,type,val}=diaryRecords();
  let curDay='',body='';
  if(!rs.length) body='<div class="empty">対象期間に実施記録がありません</div>';
  else rs.forEach(r=>{ const u=DB.users.find(x=>x.id===r.userId); const s=SVC[r.svcType];
    if(r.date!==curDay){ curDay=r.date; body+='<h4>'+mdw(r.date)+'</h4>'; }
    const chk=(r.checklist||[]).join('・');
    const stt=r.status==='missed'?'未実施':r.status==='draft'?'下書き':'確定';
    const vit=[r.temp?'体温'+r.temp+'℃':'',r.bp?'血圧'+r.bp:'',r.spo2?'SpO₂'+r.spo2:''].filter(Boolean).join(' / ');
    body+='<div class="diary-entry"><div class="hd"><span>'+(r.status==='missed'?'--:--':r.as+'–'+r.ae)+'</span><span>'+esc(u?u.name:'?')+' 様</span><span style="color:var(--muted);font-weight:600">'+esc(s.label)+'</span><span style="color:var(--muted);font-weight:600">担当 '+esc(r.helper||'—')+'</span><span style="margin-left:auto;font-size:11px;color:var(--muted)">'+stt+'</span></div>'+
      (chk?'<div class="meta">実施:'+esc(chk)+'</div>':'')+(vit?'<div class="meta">'+esc(vit)+'</div>':'')+(r.note?'<div class="meta">特記:'+esc(r.note)+'</div>':'')+'</div>';
  });
  showModal('<div class="modal wide"><div class="mhead"><h3>業務日誌 — '+esc(diaryLabel(type,val))+'</h3><span class="x" onclick="closeModal()">✕</span></div>'+
    '<div class="mbody diary"><div style="font-size:12px;color:var(--muted);margin-bottom:4px">'+esc(DB.settings.office.name)+'</div>'+
      '<div style="font-size:13px;font-weight:700;margin-bottom:8px">実施記録 日誌('+esc(diaryLabel(type,val))+') ・ 全 '+rs.length+' 件</div>'+body+'</div>'+
    '<div class="mfoot"><button class="btn" onclick="openDiary()">← 条件に戻る</button><button class="btn" onclick="closeModal()">閉じる</button><button class="btn primary" onclick="window.print()">印刷 / PDF保存</button></div></div>');
}
function exportDiaryCSV(){
  const {rs,type,val}=diaryRecords();
  if(!rs.length){ toast('対象期間に記録がありません'); return; }
  const head=['日付','開始','終了','利用者','サービス','担当','実施内容','体温','血圧','SpO2','特記','状態'];
  const lines=[head.join(',')];
  rs.forEach(r=>{ const u=DB.users.find(x=>x.id===r.userId); const s=SVC[r.svcType];
    lines.push([r.date,r.as||'',r.ae||'',u?u.name:'',s.label,r.helper||'','"'+(r.checklist||[]).join('・')+'"',r.temp||'',r.bp||'',r.spo2||'','"'+(r.note||'').replace(/"/g,'""')+'"',(r.status==='missed'?'未実施':r.status==='draft'?'下書き':'確定')].join(',')); });
  const blob=new Blob(['﻿'+lines.join('\r\n')],{type:'text/csv;charset=utf-8;'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='日誌_'+diaryLabel(type,val).replace(/[年月]/g,'-').replace(/-$/,'')+'.csv'; a.click(); toast('日誌CSVを出力しました');
}

/* ============================ 認証・起動 ============================ */
function showLogin(show){
  document.getElementById('loginScreen').style.display = show?'flex':'none';
  document.getElementById('appRoot').style.display = show?'none':'';
}
function doLogin(ev){
  ev.preventDefault();
  const email=document.getElementById('loginEmail').value.trim();
  const pass=document.getElementById('loginPass').value;
  const err=document.getElementById('loginErr'); const btn=document.getElementById('loginBtn');
  err.style.display='none'; btn.disabled=true; btn.textContent='ログイン中…';
  fbAuth.signInWithEmailAndPassword(email,pass).catch(e=>{
    const m={'auth/invalid-credential':'メールアドレスまたはパスワードが違います',
             'auth/invalid-email':'メールアドレスの形式が正しくありません',
             'auth/user-not-found':'アカウントが見つかりません',
             'auth/wrong-password':'パスワードが違います',
             'auth/too-many-requests':'試行回数が多すぎます。しばらく待って再度お試しください',
             'auth/network-request-failed':'ネットワークに接続できません'};
    err.textContent=m[e.code]||('ログインできません（'+e.code+'）'); err.style.display='block';
  }).finally(()=>{ btn.disabled=false; btn.textContent='ログイン'; });
}
function doLogout(){ if(CLOUD && confirm('ログアウトしますか?')) fbAuth.signOut(); }

async function bootCloud(){
  firebase.initializeApp(FIREBASE_CONFIG);
  fbAuth=firebase.auth(); fbDb=firebase.firestore();
  document.getElementById('logoutBtn').style.display='';
  document.getElementById('dataNote').textContent='※ データはFirestore(クラウド)に保存されます。事業所ID: '+OFFICE_ID;
  fbAuth.onAuthStateChanged(async user=>{
    if(!user){ showLogin(true); return; }
    showLogin(false);
    document.getElementById('whoami').textContent=user.email||'';
    document.getElementById('avatarChip').textContent=(user.email||'?').charAt(0).toUpperCase();
    setSyncState('saving');
    try{ await cloudLoad(); setSyncState('saved'); }
    catch(e){ console.error(e); setSyncState('error');
      alert('データの読み込みに失敗しました。\nFirestoreのセキュリティルールと、ログインアカウントの権限をご確認ください。\n\n'+(e.message||e)); }
    ui=freshUi(); render();
  });
}

if(CLOUD){ bootCloud(); }
else {
  showLogin(false);
  render();
  if(!STORAGE_OK) showStorageWarning();
}
